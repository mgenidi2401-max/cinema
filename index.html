<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سينما خاصة</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: radial-gradient(circle at top, #2b1238, #09060d 60%);
      color: #fff;
      min-height: 100vh;
    }
    header {
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(10px);
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ffd166;
    }
    .room-code {
      background: #4b145f;
      border: 1px solid #b46bff;
      padding: 10px 16px;
      border-radius: 14px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    main {
      width: min(1200px, 94%);
      margin: 28px auto;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 22px;
    }
    .cinema {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .screen-frame {
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      border: 4px solid rgba(255,209,102,.4);
    }
    video {
      width: 100%;
      display: block;
      aspect-ratio: 16/9;
      background: #000;
    }
    .upload-box {
      margin-top: 16px;
      padding: 16px;
      border: 1px dashed rgba(255,255,255,.35);
      border-radius: 16px;
      background: rgba(0,0,0,.22);
    }
    input[type="file"], input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 12px;
      border: 0;
      outline: none;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #ffd166, #f77f00);
      color: #1b1022;
      font-weight: bold;
      cursor: pointer;
    }
    aside {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      padding: 18px;
    }
    .card h3 { margin-top: 0; color: #ffd166; }
    .viewer {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .chat-box {
      height: 220px;
      overflow: auto;
      background: rgba(0,0,0,.25);
      padding: 12px;
      border-radius: 14px;
      font-size: 14px;
    }
    .msg { margin-bottom: 10px; }
    @media (max-width: 850px) {
      header { flex-direction: column; gap: 12px; text-align: center; }
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🎬 سينما خاصة</div>
    <div class="room-code">كود الغرفة: KIMO-4821</div>
  </header>

  <main>
    <section class="cinema">
      <div class="screen-frame">
        <video id="moviePlayer" controls poster="">
          المتصفح لا يدعم تشغيل الفيديو.
        </video>
      </div>

      <div class="upload-box">
        <strong>ارفع الفيلم أو اختَر ملف فيديو من جهازك:</strong>
        <input type="file" id="videoUpload" accept="video/*" />
        <button onclick="loadLocalVideo()">تشغيل الفيديو في الصفحة</button>
        <small>هذه نسخة شكلية محلية. في النسخة الحقيقية يتم رفع الملف إلى السيرفر أو التخزين السحابي.</small>
      </div>
    </section>

    <aside>
      <div class="card">
        <h3>دخول المشاهدين</h3>
        <input type="text" placeholder="اكتب كود الغرفة" />
        <button>دخول السينما</button>
      </div>

      <div class="card">
        <h3>المتفرجون الآن</h3>
        <div class="viewer"><span>أنت</span><span>المنظّم</span></div>
        <div class="viewer"><span>مشاهد 1</span><span>متصل</span></div>
        <div class="viewer"><span>مشاهد 2</span><span>متصل</span></div>
      </div>

      <div class="card">
        <h3>الدردشة</h3>
        <div class="chat-box">
          <div class="msg"><b>أنت:</b> الفيلم هيبدأ حالًا 🍿</div>
          <div class="msg"><b>مشاهد 1:</b> جاهزين</div>
        </div>
        <input type="text" placeholder="اكتب رسالة..." />
        <button>إرسال</button>
      </div>
    </aside>
  </main>

  <script>
    function loadLocalVideo() {
      const input = document.getElementById('videoUpload');
      const player = document.getElementById('moviePlayer');
      const file = input.files[0];

      if (!file) {
        alert('اختَر ملف فيديو أولًا');
        return;
      }

      const videoURL = URL.createObjectURL(file);
      player.src = videoURL;
      player.play();
    }
  </script>
</body>
</html>
