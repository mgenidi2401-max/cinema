<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎬 سينما خاصة</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="splashScreen">

  <div class="sp-box">

    <div class="sp-card">

      <div class="sp-title">
        🎬 سينما خاصة
      </div>

      <div class="sp-sub">
        مشاهدة مشتركة + رفع فيديو + مشاركة شاشة
      </div>

      <label>
        اسمك
      </label>

      <input
        id="spName"
        placeholder="مثال: أبو فريدة"
      >

      <label>
        كود الغرفة
      </label>

      <input
        id="spRoom"
        placeholder="ROOM-1234"
      >

      <label>
        كلمة المرور
      </label>

      <input
        id="spPass"
        type="password"
        placeholder="1234"
      >

      <button onclick="enterRoom()">
        دخول الغرفة
      </button>

    </div>

  </div>

</div>

<header>

  <h1>
    🎬 سينما خاصة - تحكم مشترك
  </h1>

  <div class="sub">
    رفع فيديوهات + تشغيل MP4 + مشاركة شاشة + دردشة
  </div>

</header>

<div class="wrap">

  <div class="card">

    <div
      class="screen"
      id="playerArea"
    >

      <div class="empty">
        لم يتم تشغيل أي محتوى بعد
      </div>

    </div>

    <div
      id="screenShareIndicator"
    >
      مشاركة الشاشة تعمل الآن
    </div>

    <div class="status">

      الغرفة:
      <span id="roomCodeView">
        ---
      </span>

    </div>

  </div>

  <div>

    <div class="card">

      <label>
        رفع فيديو MP4
      </label>

      <input
        type="file"
        id="videoFile"
        accept="video/mp4"
      >

      <button
        class="green"
        onclick="uploadVideo()"
      >
        رفع وتشغيل الفيديو
      </button>

      <hr>

      <button
        class="purple"
        onclick="toggleScreenShare()"
      >
        مشاركة الشاشة
      </button>

    </div>

    <div class="card">

      <h3>
        الدردشة
      </h3>

      <div
        class="chat"
        id="chatBox"
      >
      </div>

      <input
        id="chatInput"
        placeholder="اكتب رسالة..."
      >

      <button
        class="blue"
        onclick="sendChat()"
      >
        إرسال
      </button>

    </div>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

<script>

const socket = io();

let roomCode = "";
let userName = "";

function enterRoom(){

  roomCode =
    document
      .getElementById("spRoom")
      .value
      .trim();

  const password =
    document
      .getElementById("spPass")
      .value
      .trim();

  userName =
    document
      .getElementById("spName")
      .value
      .trim();

  if(!roomCode){

    alert("اكتب كود الغرفة");

    return;
  }

  socket.emit(
    "create-or-join-room",
    {
      roomCode,
      password,
      name:userName
    }
  );

  document
    .getElementById("roomCodeView")
    .innerText = roomCode;

  document
    .getElementById("splashScreen")
    .style.display = "none";

}

async function uploadVideo(){

  const file =
    document
      .getElementById("videoFile")
      .files[0];

  if(!file){

    alert("اختر فيديو");

    return;
  }

  const formData = new FormData();

  formData.append("video",file);

  const res = await fetch(
    "/upload",
    {
      method:"POST",
      body:formData
    }
  );

  const data = await res.json();

  if(!data.ok){

    alert("فشل الرفع");

    return;
  }

  playVideo(data.url);

}

function playVideo(url){

  const playerArea =
    document
      .getElementById("playerArea");

  playerArea.innerHTML = "";

  const video =
    document.createElement("video");

  video.src = url;

  video.controls = true;

  video.autoplay = true;

  video.preload = "auto";

  playerArea.appendChild(video);

}

function sendChat(){

  const input =
    document
      .getElementById("chatInput");

  const message =
    input.value.trim();

  if(!message) return;

  const box =
    document
      .getElementById("chatBox");

  const div =
    document.createElement("div");

  div.innerHTML =
    "<b>"+userName+"</b>: "+message;

  box.appendChild(div);

  box.scrollTop = box.scrollHeight;

  input.value = "";

}

</script>

</body>
</html>
